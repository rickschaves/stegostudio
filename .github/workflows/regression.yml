name: STEGO STUDIO regression

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Reconstruct and verify embedded assets
        run: node unpack_assets.js
      - name: Rebuild deterministic single-file artifact
        run: node build.js
      - name: Run regression harness
        run: node test.js
